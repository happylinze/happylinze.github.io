# The first project with an `image` is shown as a large featured card.
- name: HuggingFace-Manager
  link: https://github.com/happylinze/HuggingFace-Manager
  image: /assets/img/projects/hfmanager.png
  description: >-
    A cross-platform desktop app for the Hugging Face ecosystem. It searches
    models and datasets, downloads them with multi-threaded Aria2 or
    hf-transfer, manages the local cache, previews datasets by streaming, and
    converts models to quantized GGUF in one click.
  tags: [Python, Desktop app, Aria2, GGUF]
- name: UAV-SAR
  link: https://github.com/happylinze/UAV-SAR
  description: >-
    Skeleton-based action recognition on UAV-Human, ensembling InfoGCN with
    FR-Head, Skeleton-MixFormer and STTFormer. 2nd place at ICME 2024 MMVRAC.
  tags: [PyTorch, Skeleton, Action recognition]
- name: UAV_ReID
  link: https://github.com/happylinze/UAV_ReID
  description: >-
    An AGW-based person re-identification pipeline for drone footage on
    UAV-Human. 2nd place at ICME 2024 MMVRAC.
  tags: [PyTorch, Re-ID]
- name: AICity2023 Driving Action
  link: https://github.com/RongchangLi/AICity2023_DrivingAction
  description: >-
    Naturalistic driving action localization with action probability
    calibration. 2nd place at the AI City Challenge 2023.
  tags: [PyTorch, Temporal localization]
