zh:
  name: 李林泽
  position: 博士研究生
  affiliation: 江南大学
  visiting_position: 联合培养博士生
  visiting_affiliation: 萨里大学视觉、语音与信号处理中心（CVSSP）
  about: |-
    我是[江南大学](https://www.jiangnan.edu.cn)博士研究生，导师为[吴小俊教授](https://scholar.google.com/citations?user=5IST34sAAAAJ)。目前在英国[萨里大学视觉、语音与信号处理中心（CVSSP）](https://www.surrey.ac.uk/centre-vision-speech-signal-processing)联合培养，导师为 [Josef Kittler 教授](https://www.surrey.ac.uk/cvssp/people/josef_kittler/)。

    我的研究方向是**视频理解**，重点关注**人体动作识别**与**多模态人际交互理解**，包括小样本与零样本学习、骨架建模、长视频中的时序动作定位，以及结合视频、音频和语言识别社交互动中的事件。

    我也喜欢把研究做成能真正用起来的系统。与队友一起，我在 CVPR、ICCV、ECCV 和 ICME 举办的多项国际竞赛中取得前三名。
  interests:
