about: >-
  I am a Ph.D. student at [Jiangnan University](https://www.jiangnan.edu.cn),
  supervised by [Prof. Xiao-Jun
  Wu](https://scholar.google.com/citations?user=5IST34sAAAAJ). I am currently a
  visiting Ph.D. researcher at the [Centre for Vision, Speech and Signal
  Processing
  (CVSSP)](https://www.surrey.ac.uk/centre-vision-speech-signal-processing),
  University of Surrey, supervised by [Prof. Josef
  Kittler](https://www.surrey.ac.uk/cvssp/people/josef_kittler/).


  My research is on **video understanding**, with a focus on **human action
  recognition** and **multimodal understanding of human-human interaction**:
  learning from few or zero labelled examples, modelling skeletons, localizing
  actions in long, untrimmed videos, and recognizing events in social
  interactions from video, audio and language.


  I also enjoy turning research into working systems. With my teammates I have
  placed in the top three at challenges held with CVPR, ICCV, ECCV and ICME.
interests:
  - Action recognition
  - Video understanding
  - Human interaction understanding
  - Multi-modal learning
  - Few- & zero-shot learning
  - Skeleton-based modelling
  - Temporal action localization
