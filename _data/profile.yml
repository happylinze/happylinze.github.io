about: >-
  I am a Ph.D. student at [Jiangnan University](https://www.jiangnan.edu.cn),
  supervised by [Prof. Xiao-Jun
  Wu](https://scholar.google.com/citations?user=ZZuFlDEAAAAJ). My research is on
  **video understanding**, with a focus on **human action recognition**:
  learning from few or zero labelled examples, modelling skeletons, and
  localizing actions in long, untrimmed videos.


  I also enjoy turning research into working systems. With my teammates I have
  placed in the top three at challenges held with CVPR, ICCV, ECCV and ICME, and
  I build open-source tools such as
  [HuggingFace-Manager](https://github.com/happylinze/HuggingFace-Manager).
interests:
  - Action recognition
  - Video understanding
  - Few- & zero-shot learning
  - Skeleton-based modelling
  - Temporal action localization
  - Multi-modal learning
