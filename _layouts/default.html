<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip }}">
  <meta name="keywords" content="{{ site.keywords }}">
  <meta name="author" content="{{ site.name }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  {% if site.avatar != "" %}<meta property="og:image" content="{{ site.url }}{{ site.avatar }}">{% endif %}
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.name }}",
    "jobTitle": "{{ site.position }}",
    "affiliation": { "@type": "CollegeOrUniversity", "name": "{{ site.affiliation }}" },
    "url": "{{ site.url }}",
    "sameAs": [{% if site.google_scholar != "" %}"{{ site.google_scholar }}"{% endif %}{% if site.github != "" %}, "{{ site.github }}"{% endif %}]
  }
  </script>
</head>
<body>
  {{ content }}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
